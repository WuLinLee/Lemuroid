name: Retry Failed Builds and Notify

on:
  workflow_run:
    workflows:
      - Build Official Lemuroid (Master)
      - Checkstyle
    types: [completed]

permissions:
  actions: write
  issues: write

jobs:
  retry-or-notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (
        github.event.workflow_run.name != 'Checkstyle' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Retry once, then open a notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const attempt = run.run_attempt || 1;
            const isCheckstyle = run.name === 'Checkstyle';
            const title = isCheckstyle
              ? 'Checkstyle failure on master (ktlint violations)'
              : `Scheduled/build workflow failed: ${run.name} (run ${run.id})`;
            const runUrl = run.html_url;

            // KtLint failures are deterministic. Keep one open issue per master-branch problem.
            if (!isCheckstyle && attempt < 2) {
              await github.rest.actions.reRunWorkflowFailedJobs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              core.notice(`Requested one retry for ${runUrl}`);
              return;
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(issue => !issue.pull_request && issue.title === title)) {
              core.notice('An open notification issue already exists for this failed run.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: isCheckstyle
                ? [
                    'Checkstyle failed on master because ktlint reported Kotlin source-format violations.',
                    '',
                    `- Workflow: ${run.name}`,
                    `- Run: ${runUrl}`,
                    `- Commit: ${run.head_sha || 'unknown'}`,
                    '',
                    'This issue is deduplicated across Checkstyle failures on master. Inspect the linked run, fix formatting when appropriate, and close this issue after the workflow passes.'
                  ].join('\n')
                : [
                    'The workflow failed again after its automatic retry.',
                    '',
                    `- Workflow: ${run.name}`,
                    `- Run: ${runUrl}`,
                    `- Branch: ${run.head_branch || 'unknown'}`,
                    '',
                    'Please open the run above to inspect the error. Close this issue after the workflow succeeds or the problem is fixed.'
                  ].join('\n')
            });

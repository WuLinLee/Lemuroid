name: Handle Upstream APK Build Failure

on:
  workflow_run:
    workflows:
      - Build Latest Upstream APK
    types:
      - completed

permissions:
  actions: write
  issues: write

jobs:
  retry-or-notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Retry once, then create or update a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const attempt = run.run_attempt || 1;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream APK build failed';
            const runUrl = run.html_url;

            // Do not rebuild an APK that was already published just because release cleanup failed.
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });
            const failedSteps = jobsResponse.data.jobs.flatMap(job =>
              (job.steps || [])
                .filter(step => step.conclusion === 'failure')
                .map(step => step.name)
            );
            const retryableSteps = new Set([
              'Checkout upstream Lemuroid master',
              'Set up JDK 17',
              'Prepare Gradle wrapper',
              'Create temporary CI signing keystore',
              'Build upstream Free Dynamic Release APK'
            ]);
            const shouldRetry = failedSteps.some(name => retryableSteps.has(name));

            core.notice(`Failed steps: ${failedSteps.join(', ') || 'not reported'}`);

            // Retry a source/build failure once. Publish/cleanup failures are reported without rebuilding.
            if (attempt < 2 && shouldRetry) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner,
                  repo,
                  run_id: run.id
                });
                core.notice(`Requested one retry for ${runUrl}`);
                return;
              } catch (error) {
                core.warning(`Automatic retry could not be started: ${error.message}`);
              }
            }

            const details = [
              'The automated build of the latest upstream Lemuroid master branch failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Run number: ${run.run_number}`,
              `- Attempt: ${attempt}`,
              `- Branch: ${run.head_branch || 'unknown'}`,
              `- Workflow commit: ${run.head_sha || 'unknown'}`,
              '',
              'Open the workflow run to inspect the failed step and logs. The previous successful Latest Release remains available.'
            ].join('\n');

            const response = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = response.data.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: details
              });
              core.notice(`Updated tracking issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: details
              });
              core.notice(`Created tracking issue #${created.data.number}`);
            }

  close-notification:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close the build-failure issue after a successful release
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream APK build failed';

            const response = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = response.data.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (!existing) {
              core.notice('No open build-failure issue to close.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: [
                'The automated upstream APK build has succeeded.',
                '',
                `- Successful workflow run: ${run.html_url}`,
                '',
                'The latest APK is available from [Latest Release](https://github.com/${owner}/${repo}/releases/latest).'
              ].join('\n')
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed'
            });

            core.notice(`Closed resolved build-failure issue #${existing.number}`);

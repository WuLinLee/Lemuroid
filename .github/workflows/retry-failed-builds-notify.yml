name: Handle Upstream APK Build Failure

on:
  workflow_run:
    workflows:
      - Build Latest Upstream APK
    types:
      - completed

permissions:
  actions: write
  issues: write

jobs:
  retry-or-notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Retry once, then create or update a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const attempt = run.run_attempt || 1;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream APK build failed';
            const runUrl = run.html_url;

            // Retry only the failed job once. A second failure is reported below.
            if (attempt < 2) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner,
                  repo,
                  run_id: run.id
                });
                core.notice(`Requested one retry for ${runUrl}`);
                return;
              } catch (error) {
                core.warning(`Automatic retry could not be started: ${error.message}`);
              }
            }

            const details = [
              'The automated build of the latest upstream Lemuroid master branch failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Run number: ${run.run_number}`,
              `- Attempt: ${attempt}`,
              `- Branch: ${run.head_branch || 'unknown'}`,
              `- Workflow commit: ${run.head_sha || 'unknown'}`,
              '',
              'Open the workflow run to inspect the failed step and logs. The previously published Latest Release has not been replaced.'
            ].join('\n');

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.data.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: details
              });
              core.notice(`Updated existing tracking issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: details
              });
              core.notice(`Created tracking issue #${created.data.number}`);
            }

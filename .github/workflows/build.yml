name: Build Lemuroid APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync Upstream & Merge PR #1064
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Swordfish-Studio/Lemuroid.git || true

          if git fetch upstream main; then
            if ! git merge upstream/main --no-edit; then
              echo "Upstream conflict; keeping current code."
              git merge --abort || true
            fi
          fi

          if git fetch upstream pull/1064/head:refs/heads/pr-1064; then
            if ! git merge pr-1064 --no-edit; then
              echo "PR conflict; skipping PR merge."
              git merge --abort || true
            fi
          fi

          git log -3 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Free Bundle APK
        run: |
          ./gradlew :lemuroid-app:assembleFreeBundleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find lemuroid-app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          mkdir -p output
          cp "$APK_FILE" output/Lemuroid-FreeBundle.apk
          du -h output/Lemuroid-FreeBundle.apk
          unzip -Z1 output/Lemuroid-FreeBundle.apk | grep -E '^lib/[^/]+/*.so$' | cut -d/ -f2 | sort -u || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-FreeBundle-APK
          path: output/Lemuroid-FreeBundle.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest output/Lemuroid-FreeBundle.apk --title "Lemuroid 最新自动构建版" --notes "自动构建版本，尝试同步上游并合并 PR #1064。"
name: Build Lemuroid APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync Upstream & Merge PR #1064
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "===> 添加官方 upstream 仓库"
          git remote add upstream https://github.com/Swordfish-Studio/Lemuroid.git 2>/dev/null || true

          echo "===> 获取官方最新主分支"
          if git fetch upstream main; then
            echo "===> 尝试合并官方主分支"
            git merge upstream/main --no-edit ||
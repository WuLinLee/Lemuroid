name: Build Lemuroid APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync Upstream & Merge PR #1064
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 添加官方 upstream 仓库并同步最新主分支代码
          git remote add upstream https://github.com/Swordfish-Studio/Lemuroid.git || true
          git fetch upstream main || true
          git merge upstream/main --no-edit || {
            echo "⚠️ 与官方主分支同步时存在冲突，重置回本地代码继续..."
            git merge --abort || true
          }

          # 2. 拉取并尝试自动合并 PR #1064 (画面位置调整补丁)
          echo "===> 正在拉取 PR #1064..."
          if git fetch upstream pull/1064/head:pr-1064; then
            echo "===> 尝试合并 PR #1064..."
            git merge pr-1064 --no-edit || {
              echo "⚠️ PR #1064 与最新代码存在冲突，取消合并，保持基础代码编译。"
              git merge --abort || true
            }
          else
            echo "⚠️ 无法获取 PR #1064，跳过补丁合并。"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Free Bundle Debug APK
        run: ./gradlew :lemuroid-app:assembleFreeBundleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-FreeBundle-APK
          path: '**/build/outputs/apk/**/*.apk'
name: Build Official Lemuroid (Master)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

# Avoid overlapping runs cleaning up each other's releases.
concurrency:
  group: lemuroid-official-master-release
  cancel-in-progress: false

jobs:
  build:
    name: Build official master APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout official Lemuroid master
        uses: actions/checkout@v4
        with:
          repository: Swordfish90/Lemuroid
          ref: master
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          test -f source/gradlew
          chmod +x source/gradlew

      - name: Create CI signing keystore
        shell: bash
        run: |
          set -e
          keytool -genkeypair \
            -keystore source/release.jks \
            -storepass lemuroid \
            -keypass lemuroid \
            -alias lemuroid \
            -dname "CN=Lemuroid CI Build" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          test -f source/release.jks

      - name: Build official Free Dynamic Release
        shell: bash
        run: |
          set -e
          cd source
          ./gradlew :lemuroid-app:assembleFreeDynamicRelease --no-daemon --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -e
          mkdir -p release-apk
          find source/lemuroid-app/build/outputs/apk -type f -name '*.apk' -exec cp {} release-apk/ \;
          if ! find release-apk -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "ERROR: No APKs found. Check the Gradle build output above."
            exit 1
          fi
          ls -lh release-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-official-master-APK
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: official-master-build-${{ github.run_number }}
          name: Official master build ${{ github.run_number }}
          make_latest: true
          body: |
            Built from the official Swordfish90/Lemuroid master branch.
            This is an automated development build, not an official stable release.
            It is signed with a CI-generated keystore. Builds from different runs may
            not be installable as updates over each other; uninstall the previous CI
            build first if Android reports a signature conflict.
          files: release-apk/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove older automated releases (keep only the newest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Listing automated Lemuroid releases..."
          mapfile -t tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
              | grep -E '^official-master-build-[0-9]+$' \
              | sort -V || true
          )

          if [[ ${#tags[@]} -le 1 ]]; then
            echo "There are ${#tags[@]} automated release(s); nothing to delete."
            exit 0
          fi

          # Natural version sorting makes run 10 newer than run 9.
          keep_tag="${tags[${#tags[@]}-1]}"
          echo "Keeping newest automated release: ${keep_tag}"

          for tag in "${tags[@]}"; do
            if [[ "${tag}" == "${keep_tag}" ]]; then
              continue
            fi
            echo "Deleting older automated release and tag: ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done

          echo "Cleanup complete. Only ${keep_tag} remains among automated master releases."

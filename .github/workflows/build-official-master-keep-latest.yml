name: Build Latest Upstream APK

on:
  # Weekly build. Avoid the top of the hour, when GitHub schedule queues are busiest.
  schedule:
    - cron: '23 3 * * 0'

  # Allow an immediate or on-demand rebuild from the Actions tab.
  workflow_dispatch:

  # Run once when this workflow definition is changed (for example, to bootstrap a repaired schedule).
  push:
    paths:
      - '.github/workflows/build-official-master-keep-latest.yml'

permissions:
  contents: write

# Never let two builds race while publishing/deleting releases.
concurrency:
  group: lemuroid-upstream-master-release
  cancel-in-progress: false

jobs:
  build:
    name: Build current upstream master APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout upstream Lemuroid master
        uses: actions/checkout@v4
        with:
          repository: Swordfish90/Lemuroid
          ref: master
          path: source
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Record exact upstream revision
        id: source-info
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          short_sha="${sha:0:12}"
          source_date="$(git -C source show -s --format=%cI HEAD)"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "sha=$sha"
            echo "short_sha=$short_sha"
            echo "source_date=$source_date"
            echo "built_at=$built_at"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream source"
            echo "- Repository: [Swordfish90/Lemuroid](https://github.com/Swordfish90/Lemuroid)"
            echo "- Branch: master"
            echo "- Commit: $sha (https://github.com/Swordfish90/Lemuroid/commit/$sha)"
            echo "- Source commit date: $source_date"
            echo "- Build started: $built_at"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f source/gradlew
          chmod +x source/gradlew

      - name: Create temporary CI signing keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore source/release.jks \
            -storepass lemuroid \
            -keypass lemuroid \
            -alias lemuroid \
            -dname "CN=Lemuroid CI Build" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          test -s source/release.jks

      - name: Build upstream Free Dynamic Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd source

          # Retry transient repository/network errors such as Maven Central HTTP 429.
          for attempt in 1 2 3; do
            log_file="${RUNNER_TEMP}/gradle-build-attempt-${attempt}.log"
            echo "Gradle build attempt ${attempt}/3"

            set +e
            ./gradlew :lemuroid-app:assembleFreeDynamicRelease --no-daemon --stacktrace 2>&1 | tee "$log_file"
            gradle_status=${PIPESTATUS[0]}
            set -e

            if [ "$gradle_status" -eq 0 ]; then
              echo "Gradle build succeeded."
              exit 0
            fi

            if ! grep -Eiq '429|Too Many Requests|HTTP 5[0-9][0-9]|timed out|Connection reset|Temporary failure|UnknownHostException|Could not GET|Could not resolve' "$log_file"; then
              echo "Non-transient build failure; not retrying."
              exit "$gradle_status"
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Transient network failure persisted after 3 attempts."
              exit "$gradle_status"
            fi

            delay=$((attempt * 30))
            echo "Transient network failure. Retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Collect APKs and write build metadata
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.source-info.outputs.sha }}
          UPSTREAM_SOURCE_DATE: ${{ steps.source-info.outputs.source_date }}
          BUILD_TIME: ${{ steps.source-info.outputs.built_at }}
        run: |
          set -euo pipefail
          mkdir -p release-apk

          mapfile -d '' apk_files < <(
            find source/lemuroid-app/build/outputs/apk -type f -name '*.apk' -print0
          )

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "ERROR: No APK was produced. See the Gradle build output above."
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            cp "$apk" release-apk/
          done

          cat > release-apk/BUILD_INFO.txt <<EOF
          Project: Lemuroid
          Source repository: https://github.com/Swordfish90/Lemuroid
          Source branch: master
          Source commit: $UPSTREAM_SHA
          Source commit URL: https://github.com/Swordfish90/Lemuroid/commit/$UPSTREAM_SHA
          Source commit date: $UPSTREAM_SOURCE_DATE
          Build time: $BUILD_TIME
          Build variant: Free Dynamic Release
          Gradle task: :lemuroid-app:assembleFreeDynamicRelease
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          (
            cd release-apk
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          echo "APK files collected:"
          ls -lh release-apk/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-upstream-master-${{ steps.source-info.outputs.short_sha }}
          path: release-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest upstream build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upstream-master-build-${{ github.run_number }}
          name: Lemuroid upstream master — ${{ steps.source-info.outputs.short_sha }}
          make_latest: true
          body: |
            Automated development build from the current upstream `master` branch.

            - **Upstream repository:** https://github.com/Swordfish90/Lemuroid
            - **Source branch:** `master`
            - **Source commit:** [`${{ steps.source-info.outputs.sha }}`](https://github.com/Swordfish90/Lemuroid/commit/${{ steps.source-info.outputs.sha }})
            - **Source commit date:** ${{ steps.source-info.outputs.source_date }}
            - **Build time:** ${{ steps.source-info.outputs.built_at }}
            - **Build variant:** Free Dynamic Release

            This is an unofficial automated development build, not an official stable release.
            A temporary signing key is generated for each run. A newer build may not install
            as an in-place update over an older CI build; back up local data before uninstalling.
          files: |
            release-apk/*.apk
            release-apk/BUILD_INFO.txt
            release-apk/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the newest automated release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Finding previous automated upstream builds..."
          mapfile -t tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' \
              | grep -E '^(upstream-master-build|official-master-build)-[0-9]+$' \
              | sort -V || true
          )

          if [ "${#tags[@]}" -le 1 ]; then
            echo "Only ${#tags[@]} automated release(s) found; nothing to remove."
            exit 0
          fi

          keep_tag="${tags[${#tags[@]}-1]}"
          echo "Keeping newest automated release: $keep_tag"

          for tag in "${tags[@]}"; do
            if [ "$tag" = "$keep_tag" ]; then
              continue
            fi
            echo "Deleting older automated release: $tag"
            gh release delete "$tag" --yes
            # Delete the Git tag through the API. The checkout is the upstream
            # source repository, not this fork, so local git tag deletion is unsafe.
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag"
          done

          echo "Cleanup complete."

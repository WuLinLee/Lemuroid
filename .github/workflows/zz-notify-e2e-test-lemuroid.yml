name: Build Official Lemuroid (Master)
on:
  push:
    paths:
      - .github/workflows/zz-notify-e2e-test-lemuroid.yml

permissions:
  contents: read

jobs:
  intentional-test-failure:
    if: contains(github.event.head_commit.message, 'E2E_MONITOR_TEST_LEMUROID_20261011')
    runs-on: ubuntu-latest
    steps:
      - name: Intentional safe failure for retry/notification test
        run: |
          echo "E2E test only: this workflow contains no Gradle, APK, signing, upload, or release steps."
          exit 1

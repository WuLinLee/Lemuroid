name: Build Lemuroid APK

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFreeBundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-viewport-debug
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
          retention-days: 14
